# Nginx sirve el build estático de React y actúa como reverse proxy hacia
# el backend, para que el navegador solo necesite conocer un origen
# (evita configurar CORS del lado del navegador en producción/Docker).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy de la API: el frontend en el navegador llama a /api/v1/...
    # y Nginx lo reenvía al contenedor "backend" dentro de la red de Docker Compose.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo real se resuelve
    # con index.html para que React Router maneje el enrutamiento del lado
    # del cliente (evita 404 de Nginx al recargar /paciente/citas, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (generados por Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
